
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flex-Grow Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Flex-Grow Property</h1>

    <p>The second item grows more than the other items.</p>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item grow">Item 2 (flex-grow: 3)</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>
</body>
</html>
